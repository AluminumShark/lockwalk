name: Release

# A version tag builds once, publishes to TestPyPI, and waits for a person to approve the
# pypi environment before publishing to PyPI. Nothing is stored: PyPI trusts this workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tag can point at any commit. Only a commit that is already on main may be released.
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv build
      # Fails unless the tag is v + the built version and CHANGELOG.md has a dated heading for it.
      # Nothing is uploaded before this passes, and both publish jobs need this job.
      - name: Check the packages against the tag
        run: python3 scripts/check_package.py dist --tag "$GITHUB_REF_NAME" --changelog CHANGELOG.md
      - run: python3 scripts/smoke_wheel.py dist
      # Only the packages go in. uv build also leaves a .gitignore in dist/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      # After the upload, so nothing fetched by uvx can change what is published. A failure
      # here still fails the job, and the publish jobs need the whole job.
      - run: uvx --from twine==7.0.0 twine check dist/*.whl dist/*.tar.gz

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run must not fail because an earlier run already uploaded this version.
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
