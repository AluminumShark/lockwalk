# Hand-written facts about the multi-agent demo that no discovery source can tell lockwalk:
# who may use each entry agent, whose identity each agent uses, each tool's risk, and the
# calls that happen inside tool code, where discovery cannot look.
schema_version: '1'
roles: [analyst, trader]
agents:
  - id: supervisor
    description: Front door for analysts and traders.
    entry: true
    roles: [analyst, trader]
    delegation_mode: user
  - id: trade-desk
    description: Front door for traders only.
    entry: true
    roles: [trader]
    delegation_mode: user
  - id: finance-agent
    description: Reads portfolios and asks other agents for quotes and trades.
    delegation_mode: user
    # trade-agent is discovered (as_tool). pricing-agent is called inside the get_quote
    # tool, which discovery cannot see. Once calls is declared it must list both.
    calls: [trade-agent, pricing-agent]
  - id: trade-agent
    description: Executes trades with its own service identity.
    delegation_mode: agent
    # finance-agent is discovered (handoff). market-oracle is called inside the
    # confirm_price tool, which discovery cannot see.
    calls: [finance-agent, market-oracle]
  - id: pricing-agent
    description: Quotes stock prices.
    delegation_mode: on_behalf_of
  - id: market-oracle
    description: The exchange's remote price oracle. lockwalk cannot see what it calls.
    remote: https://oracle.example/a2a
tools:
  - id: read_portfolio
    action: portfolio:read
    risk: high
    resource_type: portfolio
  - id: get_quote
    action: market:quote
    risk: low
    resource_type: stock_symbol
  - id: execute_trade
    action: trade:execute
    risk: critical
    resource_type: order
  - id: confirm_price
    action: market:confirm
    risk: medium
    resource_type: stock_symbol
  - id: get_stock_price
    action: market:read
    risk: low
    resource_type: stock_symbol
