<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 776" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Where lockwalk sits in an agent system</title>
  <desc id="desc">A user with a role starts at an entry agent, which calls two agents. Agent A acts as the user and also calls agent B as a tool; agent B acts as itself. Each agent has a tool, and before a tool runs an enforcement point (PEP) asks a policy engine (PDP). lockwalk adds none of these. Numbered marks show where its five checks look: a tool nobody tested, a route that reaches what it must never reach, an agent allowed where the user alone is not, a policy answer you did not expect, and a tool that ran after a deny. lockwalk observe checks real traces against the same map.</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#a3a39c" stroke-width="1.4"/>
    </marker>
    <style>
      .box { fill: #45453f; stroke: #8f8f88; stroke-width: 1.5; }
      .name { fill: #f2f1ea; font-size: 24px; text-anchor: middle; }
      .small { fill: #f2f1ea; font-size: 20px; text-anchor: middle; }
      .note { fill: #cfcec6; font-size: 18px; text-anchor: middle; }
      .edge { fill: #bdbcb4; font-size: 17px; }
      .flow { fill: none; stroke: #a3a39c; stroke-width: 2.4; }
      .mark { fill: #3fc7a0; stroke: #181818; stroke-width: 2; }
      .num { fill: #0b2b24; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .check { fill: #0b5345; stroke: #3fc7a0; stroke-width: 1.5; }
      .status { fill: #a8f0d8; font-size: 22px; text-anchor: middle; font-weight: 600; }
      .what { fill: #69dcb7; font-size: 18px; text-anchor: middle; }
      .cmd { fill: #a8f0d8; font-size: 15px; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
      .panel { fill: none; stroke: #2fb58d; stroke-width: 2; stroke-dasharray: 12 9; }
      .label { fill: #f2f1ea; font-size: 22px; }
      .also { fill: #cfcec6; font-size: 19px; }
      .legend { fill: #cfcec6; font-size: 20px; }
    </style>
  </defs>

  <rect width="1240" height="776" rx="18" fill="#181818"/>

  <!-- Your existing systems -->
  <rect class="box" x="24" y="172" width="180" height="96" rx="16"/>
  <text class="name" x="114" y="213">User</text>
  <text class="note" x="114" y="245">with a role</text>

  <rect class="box" x="264" y="172" width="200" height="96" rx="16"/>
  <text class="name" x="364" y="213">Entry agent</text>
  <text class="note" x="364" y="245">Where users start</text>

  <rect class="box" x="544" y="52" width="200" height="96" rx="16"/>
  <text class="name" x="644" y="93">Agent A</text>
  <text class="note" x="644" y="125">Acts as the user</text>

  <rect class="box" x="544" y="292" width="200" height="96" rx="16"/>
  <text class="name" x="644" y="333">Agent B</text>
  <text class="note" x="644" y="365">Acts as itself</text>

  <rect class="box" x="824" y="68" width="80" height="64" rx="12"/>
  <text class="note" x="864" y="106">PEP</text>
  <rect class="box" x="824" y="308" width="80" height="64" rx="12"/>
  <text class="note" x="864" y="346">PEP</text>

  <rect class="box" x="756" y="180" width="216" height="80" rx="14"/>
  <text class="small" x="864" y="214">Policy engine (PDP)</text>
  <text class="note" x="864" y="242" style="font-size: 16px">Answers ALLOW or DENY</text>

  <rect class="box" x="984" y="68" width="232" height="64" rx="12"/>
  <text class="name" x="1100" y="108">Tool</text>
  <rect class="box" x="984" y="308" width="232" height="64" rx="12"/>
  <text class="name" x="1100" y="348">Tool</text>

  <!-- Calls -->
  <path class="flow" d="M204 220 H262" marker-end="url(#gray)"/>
  <path class="flow" d="M464 220 H504 V100 H542" marker-end="url(#gray)"/>
  <path class="flow" d="M464 220 H504 V340 H542" marker-end="url(#gray)"/>
  <path class="flow" d="M644 148 V290" marker-end="url(#gray)"/>
  <text class="edge" x="656" y="252">as a tool</text>
  <path class="flow" d="M744 100 H822" marker-end="url(#gray)"/>
  <path class="flow" d="M744 340 H822" marker-end="url(#gray)"/>
  <path class="flow" d="M904 100 H982" marker-end="url(#gray)"/>
  <path class="flow" d="M904 340 H982" marker-end="url(#gray)"/>
  <path class="flow" d="M864 134 V178" marker-start="url(#gray)" marker-end="url(#gray)"/>
  <path class="flow" d="M864 306 V262" marker-start="url(#gray)" marker-end="url(#gray)"/>

  <!-- Where lockwalk looks -->
  <circle class="mark" cx="1214" cy="70" r="15"/>
  <text class="num" x="1214" y="76">1</text>
  <circle class="mark" cx="644" cy="200" r="15"/>
  <text class="num" x="644" y="206">2</text>
  <circle class="mark" cx="742" cy="294" r="15"/>
  <text class="num" x="742" y="300">3</text>
  <circle class="mark" cx="970" cy="182" r="15"/>
  <text class="num" x="970" y="188">4</text>
  <circle class="mark" cx="902" cy="310" r="15"/>
  <text class="num" x="902" y="316">5</text>

  <!-- What lockwalk checks -->
  <rect class="panel" x="14" y="430" width="1212" height="268" rx="30"/>

  <rect class="check" x="30" y="456" width="216" height="148" rx="16"/>
  <circle class="mark" cx="54" cy="456" r="15"/>
  <text class="num" x="54" y="462">1</text>
  <text class="status" x="138" y="494">UNSPECIFIED</text>
  <text class="what" x="138" y="526">A tool nobody</text>
  <text class="what" x="138" y="550">tested</text>
  <text class="cmd" x="138" y="584">lockwalk coverage</text>

  <rect class="check" x="271" y="456" width="216" height="148" rx="16"/>
  <circle class="mark" cx="295" cy="456" r="15"/>
  <text class="num" x="295" y="462">2</text>
  <text class="status" x="379" y="494">never_reaches</text>
  <text class="what" x="379" y="526">A route reaches what</text>
  <text class="what" x="379" y="550">it must never reach</text>
  <text class="cmd" x="379" y="584">lockwalk coverage</text>

  <rect class="check" x="512" y="456" width="216" height="148" rx="16"/>
  <circle class="mark" cx="536" cy="456" r="15"/>
  <text class="num" x="536" y="462">3</text>
  <text class="status" x="620" y="494">ESCALATION</text>
  <text class="what" x="620" y="526">The agent is allowed,</text>
  <text class="what" x="620" y="550">the user alone is not</text>
  <text class="cmd" x="620" y="584">lockwalk test</text>

  <rect class="check" x="753" y="456" width="216" height="148" rx="16"/>
  <circle class="mark" cx="777" cy="456" r="15"/>
  <text class="num" x="777" y="462">4</text>
  <text class="status" x="861" y="494">FAIL_POLICY</text>
  <text class="what" x="861" y="526">Not the answer</text>
  <text class="what" x="861" y="550">you expected</text>
  <text class="cmd" x="861" y="584">lockwalk test</text>

  <rect class="check" x="994" y="456" width="216" height="148" rx="16"/>
  <circle class="mark" cx="1018" cy="456" r="15"/>
  <text class="num" x="1018" y="462">5</text>
  <text class="status" x="1102" y="494">FAIL_EXECUTION</text>
  <text class="what" x="1102" y="526">Denied, but</text>
  <text class="what" x="1102" y="550">the tool ran</text>
  <text class="cmd" x="1102" y="578">lockwalk test</text>
  <text class="cmd" x="1102" y="596">+ [harness]</text>

  <text class="label" x="44" y="642">lockwalk adds no locks of its own. It maps the ones you have and checks them.</text>
  <text class="also" x="44" y="678">lockwalk observe checks real traces against the same map: OFF_MAP, UNKNOWN, MISMATCH, BYPASS.</text>

  <!-- Legend -->
  <rect class="box" x="30" y="722" width="28" height="28" rx="6"/>
  <text class="legend" x="72" y="743">Your existing systems: the locks</text>
  <rect class="check" x="520" y="722" width="28" height="28" rx="6"/>
  <text class="legend" x="562" y="743">lockwalk: checks the locks for gaps</text>
</svg>
