# ABAC with one rule row per grant. A row says who (subject type), what (resource type),
# which action, and a condition over the request attributes. The condition is evaluated by
# Casbin's eval(); r_sub and r_obj are the subject and the resource.
[request_definition]
r = sub, act, obj

[policy_definition]
p = sub_type, act, obj_type, cond

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (p.sub_type == "any" || r.sub.type == p.sub_type) && r.act == p.act && r.obj.type == p.obj_type && eval(p.cond)
